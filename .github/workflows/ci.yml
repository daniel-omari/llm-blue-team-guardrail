name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres with pgvector, so the vector-store tests run against it
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q
      - name: Security scan (Bandit, SAST)
        run: bandit -r app -q
      # Ignored: Pillow advisories published in October 2026, fixed only in Pillow 13,
      # which is not on PyPI yet (and fastembed still caps pillow<13). Pillow is pulled
      # in by fastembed for image models; this service embeds text only and never opens
      # an image, so none of these parsers (PDF, GIF, PPM, TIFF, EPS) or text drawing
      # is reachable. Remove the ignores once Pillow 13 can be installed.
      - name: Dependency audit (pip-audit, SCA)
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln GHSA-p4wg-p73j-c528
          --ignore-vuln GHSA-65qm-jvmh-6pqg
          --ignore-vuln GHSA-58r4-6rv3-gfh8
          --ignore-vuln GHSA-pchr-8j38-3x4p
          --ignore-vuln GHSA-q45j-58j2-45rg
          --ignore-vuln GHSA-462x-pgg6-55fp
          --ignore-vuln GHSA-c6hw-5grf-ff96
          --ignore-vuln GHSA-vx6w-vv9f-6gvg
          --ignore-vuln GHSA-7mwm-ghpf-9vrm
          --ignore-vuln GHSA-w889-685w-c8fh
          --ignore-vuln GHSA-j4m9-6w36-pw47

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
