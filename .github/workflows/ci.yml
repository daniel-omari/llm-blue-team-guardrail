name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real Postgres with pgvector, so the vector-store tests run against it
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q
      - name: Security scan (Bandit, SAST)
        run: bandit -r app -q
      # Pillow is audited separately below. Its October 2026 advisories are fixed in
      # Pillow 13.0.0, which we can't install yet because fastembed (0.9.0) still
      # requires pillow<13, and new ones keep being published. Pillow is pulled in by
      # fastembed for image models; this service embeds text only and never opens an
      # image, so none of the affected parsers or text drawing is reachable. Everything
      # else that is installed is audited here and fails the build.
      - name: Dependency audit (pip-audit, SCA)
        run: |
          pip freeze --exclude pillow --exclude-editable > /tmp/audit-requirements.txt
          pip-audit --no-deps --disable-pip -r /tmp/audit-requirements.txt
      # Still reported on every run, but non-blocking until fastembed allows Pillow 13.
      - name: Pillow audit (non-blocking, waiting on fastembed)
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
