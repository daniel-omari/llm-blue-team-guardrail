<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#352a42" />
    <title>Prompt Guardrail</title>
    <script>
      // Apply the saved (or system) theme before first paint, so there is no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "night" && t !== "day") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
